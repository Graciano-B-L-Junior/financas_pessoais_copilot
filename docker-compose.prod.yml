version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: always

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - .env
    command: gunicorn api.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    env_file:
      - .env
    command: npm run start
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    restart: always

  celery:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: celery -A api worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - api
    restart: always

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    driver: bridge
