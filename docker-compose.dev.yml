version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas_pass
      POSTGRES_DB: financas_dev
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env.dev
    command: npm run dev
    volumes:
      - ./backend:/usr/src/app:cached
      - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    working_dir: /usr/src/app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env.dev
    command: npm run worker
    volumes:
      - ./backend:/usr/src/app:cached
      - /usr/src/app/node_modules
    depends_on:
      - db
      - redis
    working_dir: /usr/src/app

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

volumes:
  db-data:
  redis-data: