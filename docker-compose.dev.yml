services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: financas
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7

  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: ["python","manage.py","runserver","0.0.0.0:8000"]

  worker:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "financas_pessoais", "worker", "-l", "info"]
    depends_on:
      - redis
      - db

  beat:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    command: ["celery", "-A", "financas_pessoais", "beat", "-l", "info"]

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
  frontend_node_modules:
